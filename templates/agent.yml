# Агентний флоу: лейбл agent:go / agent:rework від людини запускає потрібний скіл.
# Специфікація: eshkil/kando-board docs/superpowers/specs/2026-10-10-agent-flow-design.md
name: Agent

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  agent:
    if: >
      github.event.action == 'labeled'
      && (github.event.label.name == 'agent:go' || github.event.label.name == 'agent:rework')
      && github.event.sender.type != 'Bot'
    runs-on: ${{ vars.AGENT_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 75
    concurrency:
      group: agent-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      # ── Налаштування стеку цього репо (BEGIN STACK) ──
      # ── (END STACK) ──

      - uses: eshkil/agent-flow@v1
        with:
          github_token: ${{ steps.app.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          agent_login: ${{ vars.AGENT_LOGIN }}
          agent_user_id: ${{ vars.AGENT_USER_ID }}
          allowed_users: ${{ vars.AGENT_ALLOWED_USERS }}
          dry_run: ${{ vars.AGENT_DRY_RUN }}
          # Модель Claude; без змінної AGENT_MODEL — за замовчуванням Claude Code.
          model: ${{ vars.AGENT_MODEL }}
          # Стан ліміту Claude для Kando (бейдж на дошці) — розкоментуй і задай
          # змінну AGENT_STATUS_URL та секрет AGENT_STATUS_SECRET:
          # status_url: ${{ vars.AGENT_STATUS_URL }}
          # status_secret: ${{ secrets.AGENT_STATUS_SECRET }}
          # timezone: Europe/Kyiv

  review-reset:
    # Новий пуш у PR скасовує попереднє AI-рев'ю: схвалено було інший код.
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          out=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/ai:reviewed" 2>&1) && exit 0
          grep -q "Label does not exist" <<<"$out" && exit 0
          echo "$out" >&2; exit 1
